name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  admin-authorization-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: '3.12'
      - name: Validate admin authorization matrix
        run: python scripts/check_admin_authorization_matrix.py
        working-directory: ${{ github.workspace }}

  error-table-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: '3.12'
      - name: Validate error table generation
        run: python scripts/generate_error_table.py --check
        working-directory: ${{ github.workspace }}

  wasm-attestation-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build WASM
        run: cargo build -p subscription_vault --target wasm32-unknown-unknown --release
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: subscription-vault-wasm
          path: target/wasm32-unknown-unknown/release/subscription_vault.wasm
          if-no-files-found: error
      - name: Attest WASM build
        uses: actions/attest-build-provenance@v2.3.0
        with:
          subject-path: target/wasm32-unknown-unknown/release/subscription_vault.wasm

  wasm-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build WASM
        run: cargo build -p subscription_vault --target wasm32-unknown-unknown --release
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: subscription-vault-wasm
          path: target/wasm32-unknown-unknown/release/subscription_vault.wasm
          if-no-files-found: error

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4.2.2
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run unit tests
        run: cargo test --all
      - name: Verify committed test snapshots
        run: |
          snapshot_dir=contracts/subscription_vault/test_snapshots
          if ! git diff --exit-code --no-ext-diff -- "$snapshot_dir"; then
            echo "Snapshot contents differ from the committed baseline."
            exit 1
          fi
          if ! diff -u \
            <(git ls-files "$snapshot_dir" | sort) \
            <(find "$snapshot_dir" -type f | sort); then
            echo "Snapshot files differ from the committed baseline."
            exit 1
          fi

  wasm-build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo registry
        uses: actions/cache@v4.2.2
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build WASM target (deployment verification)
        run: cargo build --target wasm32-unknown-unknown --all

  performance-budgets:
    runs-on: ubuntu-latest
    needs: [unit-tests, wasm-build-all]
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4.2.2
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run query performance budget tests
        run: cargo test -p subscription_vault --test query_performance -- --nocapture
        # --nocapture prints [Perf] metrics to CI log for review
      - name: Run gas and storage budget regression tests
        run: cargo test -p subscription_vault --test gas_budget -- --nocapture
        # --nocapture prints [Budget] lines for CI delta graphing (closes #489)

  coverage:
    runs-on: ubuntu-latest
    needs: [unit-tests, performance-budgets]
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4.2.2
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.txt
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.3.1
        with:
          files: lcov.txt
          fail_ci_if_error: false

  verify:
    name: Formal verification (Kani harnesses)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4.2.2
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-kani-${{ hashFiles('**/Cargo.lock') }}
      # Step 1: compile-check all harnesses with the stable toolchain.
      # This is fast (~same as cargo check) and catches type errors / API drift
      # without requiring the Kani toolchain.
      - name: Compile-check harnesses (kani_harness feature)
        run: make check
      # Step 2: run the full Kani solver on all harnesses.
      # Kani is installed via its own installer so we pin the exact version to
      # keep CI reproducible.  The solver runs each harness to exhaustive
      # completion via bounded model checking (CBMC under the hood).
      - name: Install Kani verifier
        run: cargo install --locked kani-verifier
      - name: Set up Kani toolchain
        run: cargo kani setup
      - name: Run Kani harnesses
        run: make verify

  security-audit:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4.2.2
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check prohibited license families
        run: python3 scripts/check-license-policy.py
      - name: Run cargo deny
        run: cargo deny check
